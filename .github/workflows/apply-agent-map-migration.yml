name: Apply agent-map migration

on:
  push:
    branches:
      - feat/toon-map-store

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/agent-map-migration.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/toon-map-store
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Apply migration payload
        run: |
          base64 -d .github/agent-map-migration.b64 > /tmp/agent-map-migration.tar.gz
          echo 'd5ea506b8175160baf07c5bc5d1775a6ad21ffdae2217a51378c2328695eb652  /tmp/agent-map-migration.tar.gz' | sha256sum -c -
          tar -xzf /tmp/agent-map-migration.tar.gz
          rm -f \
            .github/agent-map-migration.b64 \
            .github/workflows/apply-agent-map-migration.yml \
            .github/workflows/export-working-copy.yml \
            src/Store/MapArtifacts.php \
            src/Store/MapIntegrityValidator.php \
            src/Store/MapSnapshot.php \
            src/Store/ToonMapReader.php \
            src/Store/ToonMapWriter.php \
            tests/ToonMapStoreTest.php
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci
      - name: Commit migration
        run: |
          git config user.name 'agent-map migration'
          git config user.email 'agent-map@example.invalid'
          git add -A
          git commit -m 'feat: complete semantic map and edit-context migration'
          git push origin HEAD:feat/toon-map-store
