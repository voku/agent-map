name: Rename plan dogfood

on:
  push:
  pull_request:

concurrency:
  group: rename-plan-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rename-plan-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist

      - name: Create temporary rename projects
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agent-map-rename-dogfood"
          rm -rf "$root"
          mkdir -p "$root/method/src" "$root/function/src"
          echo "DOGFOOD_ROOT=$root" >> "$GITHUB_ENV"

          cat > "$root/method/src/Greeter.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          final class Greeter
          {
              public function oldName(string $name): string
              {
                  return 'Hello ' . $name;
              }
          }
          PHP

          cat > "$root/method/src/Caller.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          final class Caller
          {
              public function run(Greeter $greeter): string
              {
                  return $greeter->oldName('map');
              }
          }
          PHP

          cat > "$root/function/src/Functions.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          function old_function(string $name): string
          {
              return strtoupper($name);
          }
          PHP

          cat > "$root/function/src/FunctionCaller.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          function use_format(): string
          {
              return old_function('map');
          }
          PHP

      - name: Build semantic maps and publish read-only plans
        shell: bash
        run: |
          set -euo pipefail

          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/method" \
            --paths=src \
            --out="$DOGFOOD_ROOT/method/map.json" \
            --phpstan-memory-limit=512M
          php bin/agent-map rename-plan \
            'Dogfood\Greeter::oldName' renamedMethod \
            --index="$DOGFOOD_ROOT/method/map.json" \
            --format=json > "$DOGFOOD_ROOT/method/plan.json"

          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/function" \
            --paths=src \
            --out="$DOGFOOD_ROOT/function/map.json" \
            --phpstan-memory-limit=512M
          php bin/agent-map function-rename-plan \
            'Dogfood\old_function' renamed_function \
            --index="$DOGFOOD_ROOT/function/map.json" \
            --format=json > "$DOGFOOD_ROOT/function/plan.json"

      - name: Apply exact plan evidence only inside dogfood workspaces
        shell: bash
        run: |
          set -euo pipefail

          php tools/dogfood/rename-plan.php \
            "$DOGFOOD_ROOT/method" \
            "$DOGFOOD_ROOT/method/map.json" \
            "$DOGFOOD_ROOT/method/plan.json" \
            > "$DOGFOOD_ROOT/method/report.json"

          php tools/dogfood/rename-plan.php \
            "$DOGFOOD_ROOT/function" \
            "$DOGFOOD_ROOT/function/map.json" \
            "$DOGFOOD_ROOT/function/plan.json" \
            > "$DOGFOOD_ROOT/function/report.json"

      - name: Prove rewritten dummy PHP is complete and valid
        shell: bash
        run: |
          set -euo pipefail

          ! grep -R -n --fixed-strings 'oldName' "$DOGFOOD_ROOT/method/src"
          grep -R -n --fixed-strings 'renamedMethod' "$DOGFOOD_ROOT/method/src/Greeter.php"
          grep -R -n --fixed-strings 'renamedMethod' "$DOGFOOD_ROOT/method/src/Caller.php"

          ! grep -R -n --fixed-strings 'old_function' "$DOGFOOD_ROOT/function/src"
          grep -R -n --fixed-strings 'renamed_function' "$DOGFOOD_ROOT/function/src/Functions.php"
          grep -R -n --fixed-strings 'renamed_function' "$DOGFOOD_ROOT/function/src/FunctionCaller.php"

          php -l "$DOGFOOD_ROOT/method/src/Greeter.php"
          php -l "$DOGFOOD_ROOT/method/src/Caller.php"
          php -l "$DOGFOOD_ROOT/function/src/Functions.php"
          php -l "$DOGFOOD_ROOT/function/src/FunctionCaller.php"

          jq -e '.status == "passed" and .type == "method_rename_plan" and .edit_count >= 2' \
            "$DOGFOOD_ROOT/method/report.json" >/dev/null
          jq -e '.status == "passed" and .type == "function_rename_plan" and .edit_count >= 2' \
            "$DOGFOOD_ROOT/function/report.json" >/dev/null

      - name: Upload rename dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rename-plan-dogfood-${{ github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/agent-map-rename-dogfood
