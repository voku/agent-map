name: Rename plan dogfood

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: rename-plan-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rename-plan-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist

      - name: Create temporary rename projects
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agent-map-rename-dogfood"
          rm -rf "$root"
          mkdir -p "$root/method/src" "$root/function/src" "$root/class/src" "$root/property/src" "$root/self"
          echo "DOGFOOD_ROOT=$root" >> "$GITHUB_ENV"

          cat > "$root/method/src/Greeter.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          final class Greeter
          {
              public function oldName(string $name): string
              {
                  return 'Hello ' . $name;
              }
          }
          PHP

          cat > "$root/method/src/Caller.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          final class Caller
          {
              public function run(Greeter $greeter): string
              {
                  return $greeter->oldName('map');
              }
          }
          PHP

          cat > "$root/function/src/Functions.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          function old_function(string $name): string
          {
              return strtoupper($name);
          }
          PHP

          cat > "$root/function/src/FunctionCaller.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          function use_format(): string
          {
              return old_function('map');
          }
          PHP

          cat > "$root/class/src/OldService.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          final class OldService {}
          PHP

          cat > "$root/class/src/ClassConsumer.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          final class ClassConsumer
          {
              public function create(): OldService
              {
                  return new OldService();
              }
          }
          PHP

          cat > "$root/property/src/PropertyBox.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood;

          final class PropertyBox
          {
              private string $name = 'map';

              public function read(?PropertyBox $other): string
              {
                  return $other?->name ?? $this->name;
              }
          }
          PHP

      - name: Discover registered rename capabilities
        shell: bash
        run: |
          set -euo pipefail

          php bin/agent-map rename-capabilities --format=json > "$DOGFOOD_ROOT/capabilities.json"
          jq -e '.type == "rename_capabilities" and (.capabilities | length) > 0' \
            "$DOGFOOD_ROOT/capabilities.json" >/dev/null

          method_command="$(jq -r '.capabilities[] | select(.plan_type == "method_rename_plan") | .command' "$DOGFOOD_ROOT/capabilities.json")"
          function_command="$(jq -r '.capabilities[] | select(.plan_type == "function_rename_plan") | .command' "$DOGFOOD_ROOT/capabilities.json")"
          class_command="$(jq -r '.capabilities[] | select(.plan_type == "class_rename_plan") | .command' "$DOGFOOD_ROOT/capabilities.json")"
          property_command="$(jq -r '.capabilities[] | select(.plan_type == "property_rename_plan") | .command' "$DOGFOOD_ROOT/capabilities.json")"
          test -n "$method_command" && test "$method_command" != "null"
          test -n "$function_command" && test "$function_command" != "null"
          test -n "$class_command" && test "$class_command" != "null"
          test -n "$property_command" && test "$property_command" != "null"
          echo "METHOD_RENAME_COMMAND=$method_command" >> "$GITHUB_ENV"
          echo "FUNCTION_RENAME_COMMAND=$function_command" >> "$GITHUB_ENV"
          echo "CLASS_RENAME_COMMAND=$class_command" >> "$GITHUB_ENV"
          echo "PROPERTY_RENAME_COMMAND=$property_command" >> "$GITHUB_ENV"

      - name: Build semantic maps and publish read-only plans
        shell: bash
        run: |
          set -euo pipefail

          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/method" \
            --paths=src \
            --out="$DOGFOOD_ROOT/method/map.json" \
            --phpstan-memory-limit=512M
          php bin/agent-map "$METHOD_RENAME_COMMAND" \
            'Dogfood\Greeter::oldName' renamedMethod \
            --index="$DOGFOOD_ROOT/method/map.json" \
            --format=json > "$DOGFOOD_ROOT/method/plan.json"

          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/function" \
            --paths=src \
            --out="$DOGFOOD_ROOT/function/map.json" \
            --phpstan-memory-limit=512M
          php bin/agent-map "$FUNCTION_RENAME_COMMAND" \
            'Dogfood\old_function' renamed_function \
            --index="$DOGFOOD_ROOT/function/map.json" \
            --format=json > "$DOGFOOD_ROOT/function/plan.json"

          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/class" \
            --paths=src \
            --backend=structural \
            --out="$DOGFOOD_ROOT/class/map.json"
          php bin/agent-map "$CLASS_RENAME_COMMAND" \
            'Dogfood\OldService' NewService \
            --index="$DOGFOOD_ROOT/class/map.json" \
            --format=json > "$DOGFOOD_ROOT/class/plan.json"

          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/property" \
            --paths=src \
            --out="$DOGFOOD_ROOT/property/map.json" \
            --phpstan-memory-limit=512M
          php bin/agent-map "$PROPERTY_RENAME_COMMAND" \
            'Dogfood\PropertyBox::$name' label \
            --index="$DOGFOOD_ROOT/property/map.json" \
            --format=json > "$DOGFOOD_ROOT/property/plan.json"

      - name: Apply exact plan evidence only inside dogfood workspaces
        shell: bash
        run: |
          set -euo pipefail

          for kind in method function class property; do
            php tools/dogfood/rename-plan.php \
              "$DOGFOOD_ROOT/$kind" \
              "$DOGFOOD_ROOT/$kind/map.json" \
              "$DOGFOOD_ROOT/$kind/plan.json" \
              "$DOGFOOD_ROOT/capabilities.json" \
              > "$DOGFOOD_ROOT/$kind/report.json"
          done

      - name: Prove every registered capability is dogfooded
        shell: bash
        run: |
          set -euo pipefail

          jq -r '.capabilities[].plan_type' "$DOGFOOD_ROOT/capabilities.json" \
            | sort > "$DOGFOOD_ROOT/registered-plan-types.txt"
          find "$DOGFOOD_ROOT" -mindepth 2 -maxdepth 2 -name report.json -print0 \
            | xargs -0 -r jq -r '.type' \
            | sort > "$DOGFOOD_ROOT/exercised-plan-types.txt"
          diff -u "$DOGFOOD_ROOT/registered-plan-types.txt" "$DOGFOOD_ROOT/exercised-plan-types.txt"

      - name: Let agent-map discover its own rename extension points
        shell: bash
        run: |
          set -euo pipefail

          self_paths='src/Cli/CliApplication.php,src/Cli/ClassRenameCliApplication.php,src/Cli/FunctionRenameCliApplication.php,src/Cli/PropertyRenameCliApplication.php,src/Cli/RenameCliApplication.php,src/Cli/RenamePlanCapability.php,src/Cli/RenamePlanCliApplication.php,src/Rename/ClassRenamePlanner.php,src/Rename/SourceClassNameLocator.php,src/Rename/PropertyRenamePlanner.php,src/Rename/PropertyNameLocator.php,tests/CliApplicationTest.php,tests/ClassRenamePlannerTest.php,tests/PropertyRenamePlannerTest.php,tools/dogfood/rename-plan.php'
          php bin/agent-map build \
            --root="$GITHUB_WORKSPACE" \
            --paths="$self_paths" \
            --out="$DOGFOOD_ROOT/self/map.json" \
            --phpstan-memory-limit=512M
          php bin/agent-map search-index build \
            --root="$GITHUB_WORKSPACE" \
            --index="$DOGFOOD_ROOT/self/map.json" \
            --database="$DOGFOOD_ROOT/self/search.sqlite"

          php bin/agent-map related RenamePlanCliApplication \
            --root="$GITHUB_WORKSPACE" \
            --index="$DOGFOOD_ROOT/self/map.json" \
            --format=json \
            --limit=25 > "$DOGFOOD_ROOT/self/related-capability.json"
          jq -e '.primary | map(.path) | index("src/Cli/RenamePlanCliApplication.php") != null' \
            "$DOGFOOD_ROOT/self/related-capability.json" >/dev/null
          jq -e '.likely_tests | map(.path) | index("tests/CliApplicationTest.php") != null' \
            "$DOGFOOD_ROOT/self/related-capability.json" >/dev/null
          jq -e '.mentions | map(.path) | index("src/Cli/CliApplication.php") != null' \
            "$DOGFOOD_ROOT/self/related-capability.json" >/dev/null

          php bin/agent-map search 'rename capability registration' \
            --root="$GITHUB_WORKSPACE" \
            --index="$DOGFOOD_ROOT/self/map.json" \
            --database="$DOGFOOD_ROOT/self/search.sqlite" \
            --format=json \
            --limit=25 > "$DOGFOOD_ROOT/self/search-capability.json"
          for path in \
            src/Cli/RenameCliApplication.php \
            src/Cli/ClassRenameCliApplication.php \
            src/Cli/FunctionRenameCliApplication.php \
            src/Cli/PropertyRenameCliApplication.php \
            src/Cli/RenamePlanCliApplication.php \
            src/Cli/CliApplication.php
          do
            jq -e --arg path "$path" '[.results[].file_path] | index($path) != null' \
              "$DOGFOOD_ROOT/self/search-capability.json" >/dev/null
          done

          php bin/agent-map search 'property rename evidence' \
            --root="$GITHUB_WORKSPACE" \
            --index="$DOGFOOD_ROOT/self/map.json" \
            --database="$DOGFOOD_ROOT/self/search.sqlite" \
            --format=json \
            --limit=25 > "$DOGFOOD_ROOT/self/search-property.json"
          jq -e '[.results[].file_path] | index("src/Rename/PropertyRenamePlanner.php") != null' \
            "$DOGFOOD_ROOT/self/search-property.json" >/dev/null

          php bin/agent-map search 'exact rename plan dogfood evidence' \
            --root="$GITHUB_WORKSPACE" \
            --index="$DOGFOOD_ROOT/self/map.json" \
            --database="$DOGFOOD_ROOT/self/search.sqlite" \
            --format=json \
            --limit=25 > "$DOGFOOD_ROOT/self/search-dogfood.json"
          jq -e '[.results[].file_path] | index("tools/dogfood/rename-plan.php") != null' \
            "$DOGFOOD_ROOT/self/search-dogfood.json" >/dev/null

      - name: Prove rewritten dummy PHP is complete and valid
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n -q --fixed-strings 'oldName' "$DOGFOOD_ROOT/method/src"; then
            echo 'Leftover oldName in rewritten method sources.' >&2
            exit 1
          fi
          grep -R -n --fixed-strings 'renamedMethod' "$DOGFOOD_ROOT/method/src/Greeter.php"
          grep -R -n --fixed-strings 'renamedMethod' "$DOGFOOD_ROOT/method/src/Caller.php"

          if grep -R -n -q --fixed-strings 'old_function' "$DOGFOOD_ROOT/function/src"; then
            echo 'Leftover old_function in rewritten function sources.' >&2
            exit 1
          fi
          grep -R -n --fixed-strings 'renamed_function' "$DOGFOOD_ROOT/function/src/Functions.php"
          grep -R -n --fixed-strings 'renamed_function' "$DOGFOOD_ROOT/function/src/FunctionCaller.php"

          test ! -e "$DOGFOOD_ROOT/class/src/OldService.php"
          test -f "$DOGFOOD_ROOT/class/src/NewService.php"
          if grep -R -n -q --fixed-strings 'OldService' "$DOGFOOD_ROOT/class/src"; then
            echo 'Leftover OldService in rewritten class sources.' >&2
            exit 1
          fi
          grep -R -n --fixed-strings 'NewService' "$DOGFOOD_ROOT/class/src/NewService.php"
          grep -R -n --fixed-strings 'new NewService()' "$DOGFOOD_ROOT/class/src/ClassConsumer.php"

          if grep -R -n -q --fixed-strings '$name' "$DOGFOOD_ROOT/property/src"; then
            echo 'Leftover $name in rewritten property sources.' >&2
            exit 1
          fi
          grep -R -n --fixed-strings '$label' "$DOGFOOD_ROOT/property/src/PropertyBox.php"

          php -l "$DOGFOOD_ROOT/method/src/Greeter.php"
          php -l "$DOGFOOD_ROOT/method/src/Caller.php"
          php -l "$DOGFOOD_ROOT/function/src/Functions.php"
          php -l "$DOGFOOD_ROOT/function/src/FunctionCaller.php"
          php -l "$DOGFOOD_ROOT/class/src/NewService.php"
          php -l "$DOGFOOD_ROOT/class/src/ClassConsumer.php"
          php -l "$DOGFOOD_ROOT/property/src/PropertyBox.php"

          jq -e '.status == "passed" and .type == "method_rename_plan" and .kind == "method" and .edit_count >= 2' \
            "$DOGFOOD_ROOT/method/report.json" >/dev/null
          jq -e '.status == "passed" and .type == "function_rename_plan" and .kind == "function" and .edit_count >= 2' \
            "$DOGFOOD_ROOT/function/report.json" >/dev/null
          jq -e '.status == "passed" and .type == "class_rename_plan" and .kind == "class" and .edit_count >= 3 and .move_count == 1' \
            "$DOGFOOD_ROOT/class/report.json" >/dev/null
          jq -e '.status == "passed" and .type == "property_rename_plan" and .kind == "property" and .edit_count >= 3' \
            "$DOGFOOD_ROOT/property/report.json" >/dev/null

      - name: Upload rename dogfood evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rename-plan-dogfood-${{ github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/agent-map-rename-dogfood
