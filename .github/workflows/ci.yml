name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer ci

  temporal-dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Compare agent-map with its parent revision
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          previous="$tmp/previous"
          cleanup() {
            git worktree remove --force "$previous" >/dev/null 2>&1 || true
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          git worktree add --detach "$previous" HEAD^
          php bin/agent-map build --root="$previous" --paths=src --out="$tmp/before.json" --phpstan-memory-limit=512M
          php bin/agent-map build --root="$GITHUB_WORKSPACE" --paths=src --out="$tmp/after.json" --phpstan-memory-limit=512M
          php bin/agent-map history diff --before="$tmp/before.json" --after="$tmp/after.json" --format=json --limit=500 > "$tmp/diff.json"
          php tools/temporal-self-dogfood.php "$tmp/diff.json"

          php bin/agent-map history coupling --index="$tmp/after.json" --root="$GITHUB_WORKSPACE" --commits=100 --min-cochanges=2 --top=50 --format=json > "$tmp/coupling.json"
          php tools/temporal-coupling-dogfood.php "$tmp/coupling.json"
