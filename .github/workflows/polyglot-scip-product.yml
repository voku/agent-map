name: Polyglot SCIP product proof

on:
  pull_request:
    paths:
      - .github/workflows/polyglot-scip-product.yml
      - src/Cli/CliApplication.php
      - src/Cli/PolyglotQueryCliApplication.php
      - src/Evidence/**
      - tests/PolyglotQueryCliApplicationTest.php
      - tools/polyglot-evidence/**

permissions:
  contents: read

concurrency:
  group: polyglot-scip-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  definition-query:
    name: Fresh SCIP definition query
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install agent-map dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Materialize pinned JavaScript and Python repositories
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-map-polyglot-product"
          rm -rf "$root"
          mkdir -p "$root/repos" "$root/results"

          php tools/polyglot-evidence/prepare-repositories.php \
            --corpus=tools/polyglot-evidence/corpus.json \
            --workdir="$root/repos" \
            --manifest="$root/repositories.json"

      - name: Install the measured SCIP toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global \
            @sourcegraph/scip-typescript@0.4.0 \
            @sourcegraph/scip-python@0.6.6

          version='0.9.0'
          archive='scip-linux-amd64.tar.gz'
          expected='fc2e7273e110be9f35924da1066000183791e8bfdb0391355de6eaaa070fec75'
          dir="$RUNNER_TEMP/scip-${version}"
          mkdir -p "$dir"
          curl --fail --location --silent --show-error \
            "https://github.com/scip-code/scip/releases/download/v${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$dir"
          scip_bin="$(find "$dir" -type f -name scip -print -quit)"
          test -n "$scip_bin"
          chmod +x "$scip_bin"
          echo "$(dirname "$scip_bin")" >> "$GITHUB_PATH"

          scip-typescript --version
          scip-python --version
          "$scip_bin" --version

      - name: Prove owner-routed definitions on pinned repositories
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-map-polyglot-product"
          manifest="$root/repositories.json"

          js_repo="$(php -r '$m=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $m["repositories"]["sigmap"]["path"];' "$manifest")"
          py_repo="$(php -r '$m=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $m["repositories"]["flask"]["path"];' "$manifest")"

          php bin/agent-map query buildCallGraph --root="$js_repo" --format=json > "$root/results/javascript.json"
          php bin/agent-map query Flask --root="$py_repo" --format=json > "$root/results/python.json"

          validate_definition() {
            php -r '
              $p=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
              $definitions=$p["definitions"] ?? [];
              $files=is_array($definitions) ? array_column($definitions, "file") : [];
              if (($p["status"] ?? null) !== "answered" || ($p["provider"] ?? null) !== "scip" || ($p["capability"] ?? null) !== "definition" || !in_array($argv[2], $files, true)) {
                  fwrite(STDERR, "Unexpected definition evidence: " . json_encode($p, JSON_UNESCAPED_SLASHES) . PHP_EOL);
                  exit(1);
              }
              foreach ($definitions as $definition) {
                  if (($definition["line_start"] ?? 0) < 1 || ($definition["symbol_id"] ?? "") === "") {
                      fwrite(STDERR, "Definition lacks bounded source/provenance." . PHP_EOL);
                      exit(1);
                  }
              }
              if (($p["metrics"]["build_ms"] ?? 0) <= 0 || ($p["metrics"]["materialize_ms"] ?? 0) <= 0 || ($p["metrics"]["index_bytes"] ?? 0) <= 0) {
                  fwrite(STDERR, "Definition lacks native-index measurements." . PHP_EOL);
                  exit(1);
              }
            ' "$1" "$2"
          }

          validate_definition "$root/results/javascript.json" 'src/graph/call-graph.js'
          validate_definition "$root/results/python.json" 'src/flask/app.py'

          php -r '
            $p=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (count($p["definitions"] ?? []) !== 1) {
                fwrite(STDERR, "The JavaScript exact definition leaked child SCIP symbols." . PHP_EOL);
                exit(1);
            }
          ' "$root/results/javascript.json"

          cat "$root/results/javascript.json"
          cat "$root/results/python.json"

      - name: Replay real SigMap PR 579 review task
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-map-polyglot-product"
          repo="$root/dogfood/sigmap-pr-579-base"
          result="$root/results/sigmap-pr-579-scoreJvm.json"
          base='17349b333d169c5cb216a65d9dd86744046dabc5'

          mkdir -p "$repo"
          git -C "$repo" init --quiet
          git -C "$repo" remote add origin https://github.com/manojmallick/sigmap.git
          git -C "$repo" fetch --quiet --depth=1 origin "$base"
          git -C "$repo" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "$base"

          php bin/agent-map query scoreJvm --root="$repo" --format=json > "$result"

          php -r '
            $p=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            $definitions=$p["definitions"] ?? [];
            $files=is_array($definitions) ? array_values(array_unique(array_column($definitions, "file"))) : [];
            if (($p["status"] ?? null) !== "answered" || ($p["provider"] ?? null) !== "scip" || $files !== ["scripts/run-retrieval-gate.mjs"]) {
                fwrite(STDERR, "Real-task replay did not identify the implementation file changed by SigMap PR #579: " . json_encode($p, JSON_UNESCAPED_SLASHES) . PHP_EOL);
                exit(1);
            }
            if (($p["metrics"]["build_ms"] ?? 0) <= 0 || ($p["metrics"]["materialize_ms"] ?? 0) <= 0) {
                fwrite(STDERR, "Real-task replay lacks cost evidence." . PHP_EOL);
                exit(1);
            }
            printf(
                "Dogfood: SigMap PR #579 base %s, query scoreJvm -> %s:%d, build %.1f ms, materialize %.1f ms, one code file before review.\n",
                $argv[2],
                $definitions[0]["file"],
                $definitions[0]["line_start"],
                $p["metrics"]["build_ms"],
                $p["metrics"]["materialize_ms"],
            );
          ' "$result" "$base" | tee "$root/results/sigmap-pr-579-dogfood.txt"

          cat "$result"
