name: Real changed-source graph reuse A/B

on:
  push:
    branches:
      - experiment/graph-reuse-real-build-ab-*
    paths:
      - .github/workflows/graph-reuse-e2e-ab.yml
      - tools/graph-reuse-e2e-ab.php
  pull_request:
    paths:
      - .github/workflows/graph-reuse-e2e-ab.yml
      - tools/graph-reuse-e2e-ab.php
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Full PHPStan-backed CLI A/B (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Check benchmark syntax
        run: php -l tools/graph-reuse-e2e-ab.php
      - name: Measure complete changed-source builds with strict graph and artifact parity
        run: php tools/graph-reuse-e2e-ab.php
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-reuse-e2e-php-${{ matrix.php }}
          path: ${{ runner.temp }}/agent-map-graph-e2e-*/report.json
          if-no-files-found: warn
