name: Polyglot definition determinism

on:
  pull_request:
    paths:
      - .github/workflows/polyglot-definition-determinism.yml
      - src/Cli/PolyglotQueryCliApplication.php
      - src/Evidence/ScipDefinitionProvider.php

permissions:
  contents: read

concurrency:
  group: polyglot-definition-determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeatability:
    name: Repeat, relocate, mutate and restore definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Install agent-map dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Materialize pinned repositories
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-map-definition-determinism"
          rm -rf "$root"
          mkdir -p "$root/repos" "$root/results" "$root/relocated"

          php tools/polyglot-evidence/prepare-repositories.php \
            --corpus=tools/polyglot-evidence/corpus.json \
            --workdir="$root/repos" \
            --manifest="$root/repositories.json"

          js_repo="$(php -r '$m=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $m["repositories"]["sigmap"]["path"];' "$root/repositories.json")"
          py_repo="$(php -r '$m=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $m["repositories"]["flask"]["path"];' "$root/repositories.json")"

          cp -a "$js_repo" "$root/relocated/javascript-project-at-a-deliberately-different-absolute-root"
          cp -a "$py_repo" "$root/relocated/python-project-at-a-deliberately-different-absolute-root"

      - name: Install exact semantic toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global \
            @sourcegraph/scip-typescript@0.4.0 \
            @sourcegraph/scip-python@0.6.6

          version='0.9.0'
          archive='scip-linux-amd64.tar.gz'
          expected='fc2e7273e110be9f35924da1066000183791e8bfdb0391355de6eaaa070fec75'
          dir="$RUNNER_TEMP/scip-${version}"
          mkdir -p "$dir"
          curl --fail --location --silent --show-error \
            "https://github.com/scip-code/scip/releases/download/v${version}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$dir"
          scip_bin="$(find "$dir" -type f -name scip -print -quit)"
          test -n "$scip_bin"
          chmod +x "$scip_bin"
          echo "$(dirname "$scip_bin")" >> "$GITHUB_PATH"

      - name: Repeat at one root and relocate the same sources
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-map-definition-determinism"
          manifest="$root/repositories.json"
          js_repo="$(php -r '$m=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $m["repositories"]["sigmap"]["path"];' "$manifest")"
          py_repo="$(php -r '$m=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $m["repositories"]["flask"]["path"];' "$manifest")"
          js_relocated="$root/relocated/javascript-project-at-a-deliberately-different-absolute-root"
          py_relocated="$root/relocated/python-project-at-a-deliberately-different-absolute-root"

          run_case() {
            local case_name="$1"
            local primary_repo="$2"
            local relocated_repo="$3"
            local symbol="$4"
            local expected_file="$5"
            local rows="$root/results/${case_name}.jsonl"
            : > "$rows"

            run_once() {
              local location="$1"
              local run="$2"
              local repo="$3"
              local result="$root/results/${case_name}-${location}-${run}.json"
              local canonical="$root/results/${case_name}-${location}-${run}.semantic.json"

              php bin/agent-map query "$symbol" --root="$repo" --format=json > "$result"
              jq -e --arg file "$expected_file" \
                '.status == "answered" and .provider == "scip" and ([.definitions[].file] | index($file)) != null' \
                "$result"

              jq -S 'del(.metrics)' "$result" > "$canonical"
              semantic_sha="$(sha256sum "$canonical" | awk '{print $1}')"

              index="$repo/.agent-map/scip-index.scip"
              test -f "$index"
              index_sha="$(sha256sum "$index" | awk '{print $1}')"
              index_bytes="$(wc -c < "$index" | tr -d ' ')"
              reported_index_bytes="$(jq -r '.metrics.index_bytes' "$result")"
              test "$index_bytes" = "$reported_index_bytes"

              if find "$repo" -maxdepth 1 -type f -name '.agent-map-scip-*.json' -print -quit | grep -q .; then
                echo "transient JavaScript SCIP config leaked after ${case_name} ${location} run ${run}" >&2
                exit 1
              fi

              jq -n \
                --arg case "$case_name" \
                --arg location "$location" \
                --argjson run "$run" \
                --arg root "$repo" \
                --arg semantic_sha256 "$semantic_sha" \
                --arg index_sha256 "$index_sha" \
                --argjson index_bytes "$index_bytes" \
                --argjson build_ms "$(jq -r '.metrics.build_ms' "$result")" \
                --argjson materialize_ms "$(jq -r '.metrics.materialize_ms' "$result")" \
                '{case:$case,location:$location,run:$run,root:$root,semantic_sha256:$semantic_sha256,index_sha256:$index_sha256,index_bytes:$index_bytes,build_ms:$build_ms,materialize_ms:$materialize_ms}' \
                >> "$rows"
            }

            run_once primary 1 "$primary_repo"
            run_once primary 2 "$primary_repo"
            run_once relocated 1 "$relocated_repo"

            jq -s '.' "$rows" > "$root/results/${case_name}-runs.json"

            semantic_variants="$(jq -r '.[].semantic_sha256' "$root/results/${case_name}-runs.json" | sort -u | wc -l | tr -d ' ')"
            primary_raw_variants="$(jq -r '.[] | select(.location == "primary") | .index_sha256' "$root/results/${case_name}-runs.json" | sort -u | wc -l | tr -d ' ')"
            primary_raw_sha="$(jq -r '.[] | select(.location == "primary") | .index_sha256' "$root/results/${case_name}-runs.json" | head -n 1)"
            relocated_raw_sha="$(jq -r '.[] | select(.location == "relocated") | .index_sha256' "$root/results/${case_name}-runs.json")"

            test "$semantic_variants" = '1'
            test "$primary_raw_variants" = '1'
            test "$primary_raw_sha" != "$relocated_raw_sha"
          }

          run_case javascript "$js_repo" "$js_relocated" buildCallGraph src/graph/call-graph.js
          run_case python "$py_repo" "$py_relocated" Flask src/flask/app.py

      - name: Prove irrelevant changes, relevant mutations and exact restoration
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-map-definition-determinism"
          manifest="$root/repositories.json"
          js_repo="$(php -r '$m=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $m["repositories"]["sigmap"]["path"];' "$manifest")"
          py_repo="$(php -r '$m=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $m["repositories"]["flask"]["path"];' "$manifest")"

          mutation_case() {
            local case_name="$1"
            local repo="$2"
            local symbol="$3"
            local target_rel="$4"
            local baseline_result="$root/results/${case_name}-primary-2.json"
            local baseline_semantic="$root/results/${case_name}-primary-2.semantic.json"
            local baseline_semantic_sha baseline_raw_sha baseline_line

            baseline_semantic_sha="$(sha256sum "$baseline_semantic" | awk '{print $1}')"
            baseline_raw_sha="$(jq -r '.[] | select(.location == "primary" and .run == 2) | .index_sha256' "$root/results/${case_name}-runs.json")"
            baseline_line="$(jq -r --arg file "$target_rel" '.definitions[] | select(.file == $file) | .line_start' "$baseline_result" | head -n 1)"
            test -n "$baseline_line"

            note="$repo/agent-map-determinism-note.txt"
            printf 'This file is intentionally outside the indexed language surface.\n' > "$note"
            irrelevant="$root/results/${case_name}-irrelevant.json"
            irrelevant_semantic="$root/results/${case_name}-irrelevant.semantic.json"
            php bin/agent-map query "$symbol" --root="$repo" --format=json > "$irrelevant"
            jq -S 'del(.metrics)' "$irrelevant" > "$irrelevant_semantic"
            irrelevant_semantic_sha="$(sha256sum "$irrelevant_semantic" | awk '{print $1}')"
            irrelevant_raw_sha="$(sha256sum "$repo/.agent-map/scip-index.scip" | awk '{print $1}')"
            test "$irrelevant_semantic_sha" = "$baseline_semantic_sha"
            rm "$note"

            target="$repo/$target_rel"
            temporary="$target.agent-map-determinism"
            { printf '\n'; cat "$target"; } > "$temporary"
            mv "$temporary" "$target"

            mutated="$root/results/${case_name}-mutated.json"
            mutated_semantic="$root/results/${case_name}-mutated.semantic.json"
            php bin/agent-map query "$symbol" --root="$repo" --format=json > "$mutated"
            jq -S 'del(.metrics)' "$mutated" > "$mutated_semantic"
            mutated_semantic_sha="$(sha256sum "$mutated_semantic" | awk '{print $1}')"
            mutated_raw_sha="$(sha256sum "$repo/.agent-map/scip-index.scip" | awk '{print $1}')"
            mutated_line="$(jq -r --arg file "$target_rel" '.definitions[] | select(.file == $file) | .line_start' "$mutated" | head -n 1)"
            test "$mutated_semantic_sha" != "$baseline_semantic_sha"
            test "$mutated_raw_sha" != "$baseline_raw_sha"
            test "$mutated_line" = "$((baseline_line + 1))"

            git -C "$repo" checkout -- "$target_rel"
            restored="$root/results/${case_name}-restored.json"
            restored_semantic="$root/results/${case_name}-restored.semantic.json"
            php bin/agent-map query "$symbol" --root="$repo" --format=json > "$restored"
            jq -S 'del(.metrics)' "$restored" > "$restored_semantic"
            restored_semantic_sha="$(sha256sum "$restored_semantic" | awk '{print $1}')"
            restored_raw_sha="$(sha256sum "$repo/.agent-map/scip-index.scip" | awk '{print $1}')"
            test "$restored_semantic_sha" = "$baseline_semantic_sha"
            test "$restored_raw_sha" = "$baseline_raw_sha"

            jq -n \
              --arg case "$case_name" \
              --arg baseline_semantic_sha256 "$baseline_semantic_sha" \
              --arg irrelevant_semantic_sha256 "$irrelevant_semantic_sha" \
              --arg mutated_semantic_sha256 "$mutated_semantic_sha" \
              --arg restored_semantic_sha256 "$restored_semantic_sha" \
              --arg baseline_raw_sha256 "$baseline_raw_sha" \
              --arg irrelevant_raw_sha256 "$irrelevant_raw_sha" \
              --arg mutated_raw_sha256 "$mutated_raw_sha" \
              --arg restored_raw_sha256 "$restored_raw_sha" \
              --argjson baseline_line "$baseline_line" \
              --argjson mutated_line "$mutated_line" \
              '{
                case:$case,
                semantic:{baseline:$baseline_semantic_sha256,irrelevant:$irrelevant_semantic_sha256,mutated:$mutated_semantic_sha256,restored:$restored_semantic_sha256},
                raw_index:{baseline:$baseline_raw_sha256,irrelevant:$irrelevant_raw_sha256,mutated:$mutated_raw_sha256,restored:$restored_raw_sha256},
                line:{baseline:$baseline_line,mutated:$mutated_line},
                irrelevant_raw_changed:($baseline_raw_sha256 != $irrelevant_raw_sha256)
              }' > "$root/results/${case_name}-mutation-summary.json"
          }

          mutation_case javascript "$js_repo" buildCallGraph src/graph/call-graph.js
          mutation_case python "$py_repo" Flask src/flask/app.py

      - name: Classify semantic and provider-native determinism
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-map-definition-determinism/results"

          jq -n \
            --slurpfile js "$root/javascript-runs.json" \
            --slurpfile py "$root/python-runs.json" '
              def summary($runs):
                ($runs[0]) as $r |
                ($r | map(select(.location == "primary"))) as $primary |
                ($r | map(select(.location == "relocated"))) as $relocated |
                {
                  semantic_hashes: ([$r[].semantic_sha256] | unique),
                  primary_raw_index_hashes: ([$primary[].index_sha256] | unique),
                  relocated_raw_index_hashes: ([$relocated[].index_sha256] | unique),
                  raw_hash_changes_after_relocation: (($primary[0].index_sha256) != ($relocated[0].index_sha256)),
                  primary_index_sizes: ([$primary[].index_bytes] | unique),
                  relocated_index_sizes: ([$relocated[].index_bytes] | unique),
                  build_ms: {min: ([$r[].build_ms] | min), max: ([$r[].build_ms] | max), avg: (([$r[].build_ms] | add) / ($r | length))},
                  materialize_ms: {min: ([$r[].materialize_ms] | min), max: ([$r[].materialize_ms] | max), avg: (([$r[].materialize_ms] | add) / ($r | length))}
                };
              {
                javascript: summary($js),
                python: summary($py)
              }
            ' > "$root/determinism-summary.json"

          jq -e '.javascript.semantic_hashes | length == 1' "$root/determinism-summary.json"
          jq -e '.python.semantic_hashes | length == 1' "$root/determinism-summary.json"
          jq -e '.javascript.primary_raw_index_hashes | length == 1' "$root/determinism-summary.json"
          jq -e '.python.primary_raw_index_hashes | length == 1' "$root/determinism-summary.json"
          jq -e '.javascript.raw_hash_changes_after_relocation == true' "$root/determinism-summary.json"
          jq -e '.python.raw_hash_changes_after_relocation == true' "$root/determinism-summary.json"

          cat "$root/determinism-summary.json"
          cat "$root/javascript-mutation-summary.json"
          cat "$root/python-mutation-summary.json"

      - name: Publish determinism evidence
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/agent-map-definition-determinism/results"
          summary="$root/determinism-summary.json"

          emit_case() {
            local label="$1"
            local key="$2"
            local semantic_count primary_hash_count relocated_changes primary_sizes relocated_sizes build_min build_max materialize_min materialize_max irrelevant_raw_changed
            semantic_count="$(jq -r ".${key}.semantic_hashes | length" "$summary")"
            primary_hash_count="$(jq -r ".${key}.primary_raw_index_hashes | length" "$summary")"
            relocated_changes="$(jq -r ".${key}.raw_hash_changes_after_relocation" "$summary")"
            primary_sizes="$(jq -c ".${key}.primary_index_sizes" "$summary")"
            relocated_sizes="$(jq -c ".${key}.relocated_index_sizes" "$summary")"
            build_min="$(jq -r ".${key}.build_ms.min" "$summary")"
            build_max="$(jq -r ".${key}.build_ms.max" "$summary")"
            materialize_min="$(jq -r ".${key}.materialize_ms.min" "$summary")"
            materialize_max="$(jq -r ".${key}.materialize_ms.max" "$summary")"
            irrelevant_raw_changed="$(jq -r '.irrelevant_raw_changed' "$root/${key}-mutation-summary.json")"

            echo "- ${label}: semantic variants=${semantic_count}; same-root raw variants=${primary_hash_count}; raw hash changes after relocation=${relocated_changes}; irrelevant-file raw change=${irrelevant_raw_changed}; primary bytes=${primary_sizes}; relocated bytes=${relocated_sizes}; build=${build_min}-${build_max} ms; materialize=${materialize_min}-${materialize_max} ms"
          }

          {
            echo '## Polyglot definition determinism'
            echo
            echo 'Evidence dimensions: repeat builds, relocation, an irrelevant non-code file, a relevant source-line mutation, and exact source restoration.'
            echo
            emit_case 'JavaScript / SigMap / buildCallGraph' javascript
            emit_case 'Python / Flask / Flask' python
            echo
            echo 'Hard contract: normalized definition evidence is invariant under repeat builds, runner changes, relocation, irrelevant non-code files, and exact restoration. A relevant line mutation must change the semantic evidence and native index, and restoration must reproduce both baseline identities. The provider-native SCIP blob remains root-local because SCIP metadata carries the absolute project root. Runtime metrics remain observations, not identity.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polyglot-definition-determinism-${{ github.sha }}
          path: |
            ${{ runner.temp }}/agent-map-definition-determinism/results/*.json
            ${{ runner.temp }}/agent-map-definition-determinism/results/*.jsonl
          if-no-files-found: error
