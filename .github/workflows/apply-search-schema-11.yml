name: Apply Search Schema 1.1

on:
  push:
    branches:
      - agent/issue-12-symbol-less-search
    paths:
      - '.github/workflows/apply-search-schema-11.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add file-body schema support and bounded migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/Search/SearchIndexStore.php')
          text = path.read_text(encoding='utf-8')

          old = "    public const SCHEMA_VERSION = '1.0';\n"
          if text.count(old) != 1:
              raise SystemExit('search schema version anchor changed')
          text = text.replace(old, "    public const SCHEMA_VERSION = '1.1';\n", 1)

          table_pattern = re.compile(
              r"        \$this->pdo->exec\(\n"
              r"            \"CREATE TABLE IF NOT EXISTS code_chunks \(.*?\n"
              r"        \);\n",
              re.S,
          )
          text, count = table_pattern.subn(
              "        $rebuildFts = $this->migrateChunkKindConstraint();\n"
              "        $this->createCodeChunksTable();\n",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('code_chunks schema block changed')

          fts_marker = "        $this->pdo->exec(\n            \"CREATE VIRTUAL TABLE IF NOT EXISTS code_chunks_fts USING fts5("
          start = text.find(fts_marker)
          if start < 0:
              raise SystemExit('FTS schema block changed')
          end = text.find("        );\n", start)
          if end < 0:
              raise SystemExit('FTS schema end changed')
          end += len("        );\n")
          fts_block = text[start:end]
          text = text[:end] + (
              "        if ($rebuildFts) {\n"
              "            $this->pdo->exec(\"INSERT INTO code_chunks_fts(code_chunks_fts) VALUES ('rebuild')\");\n"
              "        }\n"
          ) + text[end:]

          migrate = '    private function migrate(): void\n'
          pos = text.find(migrate)
          if pos < 0:
              raise SystemExit('migrate() anchor changed')

          helpers = '''    private function createCodeChunksTable(): void
          {
              $this->pdo->exec(
                  "CREATE TABLE IF NOT EXISTS code_chunks (
                      rowid INTEGER PRIMARY KEY,
                      chunk_id TEXT NOT NULL UNIQUE,
                      symbol_id TEXT NOT NULL,
                      file_path TEXT NOT NULL,
                      symbol_name TEXT NOT NULL,
                      chunk_kind TEXT NOT NULL CHECK (
                          chunk_kind IN ('symbol_overview', 'method_body', 'function_body', 'method_fragment', 'file_body')
                      ),
                      start_line INTEGER NOT NULL,
                      end_line INTEGER NOT NULL,
                      source_sha256 TEXT NOT NULL,
                      content_sha256 TEXT NOT NULL,
                      signature TEXT NOT NULL,
                      content TEXT NOT NULL
                  )",
              );
          }

          /**
           * Search is derived, but preserving row ids keeps an existing vector projection aligned.
           * Schema 1.1 only widens the allowed chunk kinds, so existing chunks can be copied verbatim
           * before the FTS projection is rebuilt.
           */
          private function migrateChunkKindConstraint(): bool
          {
              if ($this->meta('schema_version') !== '1.0') {
                  return false;
              }

              $statement = $this->pdo->query(
                  "SELECT sql FROM sqlite_master WHERE type = 'table' AND name = 'code_chunks'",
              );
              $schema = $statement === false ? false : $statement->fetchColumn();
              if (!is_string($schema) || str_contains($schema, "'file_body'")) {
                  return false;
              }

              $this->pdo->beginTransaction();
              try {
                  $this->pdo->exec('DROP TABLE IF EXISTS code_chunks_fts');
                  $this->pdo->exec('ALTER TABLE code_chunks RENAME TO code_chunks_v10');
                  $this->createCodeChunksTable();
                  $this->pdo->exec(
                      'INSERT INTO code_chunks
                          (rowid, chunk_id, symbol_id, file_path, symbol_name, chunk_kind, start_line, end_line,
                           source_sha256, content_sha256, signature, content)
                       SELECT
                          rowid, chunk_id, symbol_id, file_path, symbol_name, chunk_kind, start_line, end_line,
                          source_sha256, content_sha256, signature, content
                       FROM code_chunks_v10',
                  );
                  $this->pdo->exec('DROP TABLE code_chunks_v10');
                  $this->pdo->commit();
              } catch (\Throwable $exception) {
                  $this->pdo->rollBack();
                  throw $exception;
              }

              return true;
          }

          '''
          text = text[:pos] + helpers + text[pos:]
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/apply-search-schema-11.yml
          git diff --check

      - name: Commit schema migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: migrate search index for file chunks'
          git push origin HEAD:agent/issue-12-symbol-less-search
