name: Apply Issue 12 Fix

on:
  push:
    branches:
      - agent/issue-12-symbol-less-search
    paths:
      - '.github/workflows/apply-issue-12-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add bounded file segments for mapped PHP files without symbols
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          policy = Path('src/Search/ChunkPolicy.php')
          text = policy.read_text(encoding='utf-8')
          needle = '    public const MAX_BODY_LINES = 400;\n'
          replacement = needle + "\n    /** Symbol-less mapped files are indexed in bounded source-backed segments of this size. */\n    public const MAX_FILE_LINES = 400;\n"
          if text.count(needle) != 1:
              raise SystemExit('ChunkPolicy anchor changed')
          policy.write_text(text.replace(needle, replacement), encoding='utf-8')

          chunk = Path('src/Search/CodeChunk.php')
          text = chunk.read_text(encoding='utf-8')
          needle = "    public const KIND_FUNCTION_BODY = 'function_body';\n"
          replacement = needle + "\n    public const KIND_FILE_BODY = 'file_body';\n"
          if text.count(needle) != 1:
              raise SystemExit('CodeChunk kind anchor changed')
          text = text.replace(needle, replacement)
          needle = "            self::KIND_SYMBOL_OVERVIEW => 'overview',\n"
          replacement = needle + "            self::KIND_FILE_BODY       => 'file',\n"
          if text.count(needle) != 1:
              raise SystemExit('CodeChunk identity anchor changed')
          chunk.write_text(text.replace(needle, replacement), encoding='utf-8')

          extractor = Path('src/Search/ChunkExtractor.php')
          text = extractor.read_text(encoding='utf-8')
          needle = '            $before = count($chunks);\n'
          replacement = needle + """            if ($file->symbols === []) {
                  $fileChunks = $this->fileChunks($root, $file);
                  if ($fileChunks === null) {
                      $this->skippedPaths[] = $file->path;
                  } else {
                      foreach ($fileChunks as $chunk) {
                          $chunks[] = $chunk;
                      }
                  }
                  continue;
              }

          """
          if text.count(needle) != 1:
              raise SystemExit('ChunkExtractor loop anchor changed')
          text = text.replace(needle, replacement)

          method = '    private function overviewChunk(string $root, FileEntry $file, SymbolEntry $symbol): ?CodeChunk\n'
          method_pos = text.find(method)
          if method_pos < 0:
              raise SystemExit('ChunkExtractor overview method changed')
          doc_pos = text.rfind('    /**\n', 0, method_pos)
          if doc_pos < 0:
              raise SystemExit('ChunkExtractor overview docblock changed')
          helper = """    /**
           * @return list<CodeChunk>|null null when the mapped source is stale
           */
              private function fileChunks(string $root, FileEntry $file): ?array
              {
                  $chunks = [];
                  $startLine = 1;
                  $segment = 1;

                  while (true) {
                      $requestedEndLine = $startLine + ChunkPolicy::MAX_FILE_LINES - 1;
                      $slice = $this->slice($root, $file, $startLine, $requestedEndLine);
                      if ($slice === null) {
                          return null;
                      }
                      if ($slice['content'] === '') {
                          break;
                      }

                      $symbolId = 'file:' . $file->path . ':segment:' . $segment;
                      $chunks[] = CodeChunk::create(
                          symbolId: $symbolId,
                          kind: CodeChunk::KIND_FILE_BODY,
                          filePath: $file->path,
                          symbolName: $file->path,
                          startLine: $slice['start'],
                          endLine: $slice['end'],
                          sourceSha256: $file->sha256,
                          signature: 'file ' . $file->path,
                          content: $slice['content'],
                      );

                      if ($slice['end'] < $requestedEndLine) {
                          break;
                      }
                      $startLine = $requestedEndLine + 1;
                      ++$segment;
                  }

                  return $chunks;
              }

          """
          extractor.write_text(text[:doc_pos] + helper + text[doc_pos:], encoding='utf-8')
          PY

          git rm .github/workflows/apply-issue-12-fix.yml
          git diff --check
          git diff -- src/Search/ChunkPolicy.php src/Search/CodeChunk.php src/Search/ChunkExtractor.php tests/SymbolLessSearchTest.php

      - name: Commit bounded production fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: index symbol-less mapped PHP files'
          git push origin HEAD:agent/issue-12-symbol-less-search
