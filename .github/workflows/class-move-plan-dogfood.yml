name: Class move plan dogfood

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: class-move-plan-dogfood-${{ github.ref }}
  cancel-in-progress: true

jobs:
  class-move-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist

      - name: Create isolated PSR-4 move fixtures
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/agent-map-class-move-dogfood"
          rm -rf "$root"
          mkdir -p "$root/safe/src/Legacy" "$root/safe/src/Client" "$root/safe/src/Service" \
                   "$root/occupied/src/Legacy" "$root/occupied/src/Service"
          echo "DOGFOOD_ROOT=$root" >> "$GITHUB_ENV"

          for project in safe occupied; do
            cat > "$root/$project/composer.json" <<'JSON'
          {
              "name": "dogfood/class-move",
              "autoload": {
                  "psr-4": {
                      "Dogfood\\": "src/"
                  }
              }
          }
          JSON
          done

          # The move contract is routed like the other governed non-rename plans, so the dogfood
          # declares the contract identity it expects instead of reading the rename registry.
          cat > "$root/capability.json" <<'JSON'
          {
              "kind": "class_move",
              "command": "class-move-plan",
              "plan_type": "class_move_plan",
              "contract_version": "1.0",
              "semantic_backend": "none"
          }
          JSON

          cat > "$root/safe/src/Legacy/UserService.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood\Legacy;

          final class UserService
          {
              public function run(): string
              {
                  return 'ok';
              }
          }
          PHP

          cat > "$root/safe/src/Client/Consumer.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood\Client;

          use Dogfood\Legacy\UserService;

          final class Consumer
          {
              public function make(UserService $input): UserService
              {
                  return $input;
              }

              public function name(): string
              {
                  return \Dogfood\Legacy\UserService::class;
              }
          }
          PHP

          cat > "$root/occupied/src/Legacy/UserService.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood\Legacy;

          final class UserService
          {
          }
          PHP

          cat > "$root/occupied/src/Service/UserService.php" <<'PHP'
          <?php

          declare(strict_types=1);

          namespace Dogfood\Service;

          function unrelated(): void
          {
          }
          PHP

      - name: Publish exact read-only class-move evidence without PHPStan
        shell: bash
        run: |
          set -euo pipefail

          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/safe" \
            --paths=src \
            --backend=structural \
            --out="$DOGFOOD_ROOT/safe/map.json"

          before="$(sha256sum "$DOGFOOD_ROOT/safe/src/Legacy/UserService.php" | cut -d' ' -f1)"
          php bin/agent-map class-move-plan \
            'Dogfood\Legacy\UserService' \
            'Dogfood\Service\UserService' \
            --index="$DOGFOOD_ROOT/safe/map.json" \
            --format=json > "$DOGFOOD_ROOT/safe/plan.json"
          after="$(sha256sum "$DOGFOOD_ROOT/safe/src/Legacy/UserService.php" | cut -d' ' -f1)"
          test "$before" = "$after"

          jq -e '
            (.type == "class_move_plan")
            and (.contract_version == "1.0")
            and (.status == "safe")
            and (.blind_spots == [])
            and (.stale_evidence == [])
            and (.blockers == [])
            and (.autoload.manifest_path == "composer.json")
            and (.autoload.manifest_sha256 | startswith("sha256:"))
            and (.autoload.destination_path == "src/Service/UserService.php")
            and (.edits | length == 3)
            and ([.edits[].role] | sort == ["class_import", "class_reference", "namespace_declaration"])
            and ([.edits[] | select(.source_sha256 | startswith("sha256:") | not)] | length == 0)
            and (.moves | length == 1)
            and (.moves[0].from_path == "src/Legacy/UserService.php")
            and (.moves[0].to_path == "src/Service/UserService.php")
            and (.moves[0].destination_must_be_absent == true)
          ' "$DOGFOOD_ROOT/safe/plan.json" >/dev/null

          php bin/agent-map class-move-plan \
            'Dogfood\Legacy\UserService' \
            'Dogfood\Service\UserService' \
            --index="$DOGFOOD_ROOT/safe/map.json" \
            --format=text > "$DOGFOOD_ROOT/safe/plan.txt"
          php bin/agent-map class-move-plan \
            'Dogfood\Legacy\UserService' \
            'Dogfood\Service\UserService' \
            --index="$DOGFOOD_ROOT/safe/map.json" \
            --format=toon > "$DOGFOOD_ROOT/safe/plan.toon"
          test -s "$DOGFOOD_ROOT/safe/plan.txt"
          test -s "$DOGFOOD_ROOT/safe/plan.toon"
          test "$before" = "$(sha256sum "$DOGFOOD_ROOT/safe/src/Legacy/UserService.php" | cut -d' ' -f1)"

      - name: Prove the published evidence relocates real PHP
        shell: bash
        run: |
          set -euo pipefail

          php tools/dogfood/rename-plan.php \
            "$DOGFOOD_ROOT/safe" \
            "$DOGFOOD_ROOT/safe/map.json" \
            "$DOGFOOD_ROOT/safe/plan.json" \
            "$DOGFOOD_ROOT/capability.json" > "$DOGFOOD_ROOT/safe/dogfood.json"

          jq -e '
            (.type == "class_move_plan")
            and (.status == "passed")
            and (.edit_count == 3)
            and (.move_count == 1)
            and (.moves[0].to_path == "src/Service/UserService.php")
          ' "$DOGFOOD_ROOT/safe/dogfood.json" >/dev/null

          test ! -e "$DOGFOOD_ROOT/safe/src/Legacy/UserService.php"
          php -l "$DOGFOOD_ROOT/safe/src/Service/UserService.php"
          php -l "$DOGFOOD_ROOT/safe/src/Client/Consumer.php"
          grep -q 'namespace Dogfood\\Service;' "$DOGFOOD_ROOT/safe/src/Service/UserService.php"
          grep -q 'use Dogfood\\Service\\UserService;' "$DOGFOOD_ROOT/safe/src/Client/Consumer.php"
          grep -q '\\Dogfood\\Service\\UserService::class' "$DOGFOOD_ROOT/safe/src/Client/Consumer.php"

          # The relocated identity has to be observable at its declared PSR-4 location.
          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/safe" \
            --paths=src \
            --backend=structural \
            --out="$DOGFOOD_ROOT/safe/map-after.json"
          jq -e '
            ([.files[] | select(.path == "src/Service/UserService.php") | .symbols[] | select(.fqn == "Dogfood\\Service\\UserService")] | length == 1)
            and ([.files[] | select(.path == "src/Legacy/UserService.php")] | length == 0)
          ' "$DOGFOOD_ROOT/safe/map-after.json" >/dev/null

      - name: Prove an occupied destination fails closed
        shell: bash
        run: |
          set -euo pipefail

          php bin/agent-map build \
            --root="$DOGFOOD_ROOT/occupied" \
            --paths=src \
            --backend=structural \
            --out="$DOGFOOD_ROOT/occupied/map.json"

          before="$(sha256sum "$DOGFOOD_ROOT/occupied/src/Legacy/UserService.php" | cut -d' ' -f1)"
          set +e
          php bin/agent-map class-move-plan \
            'Dogfood\Legacy\UserService' \
            'Dogfood\Service\UserService' \
            --index="$DOGFOOD_ROOT/occupied/map.json" \
            --format=json > "$DOGFOOD_ROOT/occupied/plan.json"
          status=$?
          set -e
          test "$status" -eq 1

          jq -e '
            (.status == "blocked")
            and (.edits == [])
            and (.moves == [])
            and ([.blockers[] | contains("Destination class path already exists")] | any)
          ' "$DOGFOOD_ROOT/occupied/plan.json" >/dev/null
          test "$before" = "$(sha256sum "$DOGFOOD_ROOT/occupied/src/Legacy/UserService.php" | cut -d' ' -f1)"
