name: Semantic retarget probe (experimental)

on:
  pull_request:
    paths:
      - '.github/workflows/semantic-retarget-probe.yml'
      - 'tools/temporal-retarget-probe.php'
      - 'docs/experiments/semantic-retarget-probe.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-retarget-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-history-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist

      - name: Prove controlled semantic-classification invariants
        run: |
          set -euo pipefail
          php -l tools/temporal-retarget-probe.php
          php tools/temporal-retarget-probe.php --self-test

      - name: Build real historical and current canonical maps
        shell: bash
        run: |
          set -euo pipefail
          expected_head="${{ github.event.pull_request.head.sha || github.sha }}"
          if [[ "$(git rev-parse HEAD)" != "$expected_head" ]]; then
            echo "Checkout is not at the exact requested head SHA." >&2
            exit 1
          fi
          out="$RUNNER_TEMP/semantic-retarget-probe"
          mkdir -p "$out"
          previous="$out/previous"
          baseline=""
          while IFS= read -r tag; do
            if ! git diff --quiet "$tag" HEAD -- src; then
              baseline="$tag"
              break
            fi
          done < <(git tag --merged HEAD --sort=-v:refname)
          if [[ -z "$baseline" ]]; then
            baseline="$(git rev-list --max-parents=0 HEAD)"
          fi
          if git diff --quiet "$baseline" HEAD -- src; then
            echo 'No real source evolution found for comparison.' >&2
            exit 1
          fi
          git worktree add --detach "$previous" "$baseline"
          printf 'baseline_ref=%s\nbaseline_sha=%s\nhead_sha=%s\n' \
            "$baseline" "$(git rev-parse "$baseline^{commit}")" "$(git rev-parse HEAD)" \
            > "$out/revisions.txt"
          php bin/agent-map build --root="$previous" --paths=src --out="$out/before.json" --phpstan-memory-limit=512M
          php bin/agent-map build --root="$GITHUB_WORKSPACE" --paths=src --out="$out/after.json" --phpstan-memory-limit=512M
          echo "PROBE_OUT=$out" >> "$GITHUB_ENV"

      - name: Run existing temporal diff and experimental classification
        shell: bash
        run: |
          set -euo pipefail
          php bin/agent-map history diff \
            --before="$PROBE_OUT/before.json" \
            --after="$PROBE_OUT/after.json" \
            --format=json --limit=250000 > "$PROBE_OUT/history-diff.json"
          php tools/temporal-retarget-probe.php "$PROBE_OUT/history-diff.json" > "$PROBE_OUT/retarget-evidence.json"
          php tools/temporal-retarget-probe.php "$PROBE_OUT/history-diff.json" > "$PROBE_OUT/repeat.json"
          cmp "$PROBE_OUT/retarget-evidence.json" "$PROBE_OUT/repeat.json"
          php -r '
            $diff = json_decode((string) file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            $probe = json_decode((string) file_get_contents($argv[2]), true, 512, JSON_THROW_ON_ERROR);
            if (($diff["truncated"] ?? true) || !is_int($diff["event_count"] ?? null)
                || !is_int($probe["candidate_count"] ?? null)
                || !is_int($probe["ambiguous_group_count"] ?? null)
                || ($probe["evidence_level"] ?? null) !== "UNVERIFIED"
                || ($probe["schema_version"] ?? null) !== 2) {
              throw new RuntimeException("Incomplete or falsely authoritative comparison evidence.");
            }
            $summary = "## Experimental semantic retarget probe\n\n";
            $summary .= "- Actual agent-map history events: **" . $diff["event_count"] . "**\n";
            $summary .= "- Possible retargets (UNVERIFIED): **" . $probe["candidate_count"] . "**\n";
            $summary .= "- Ambiguous groups (no guessed pairings): **" . $probe["ambiguous_group_count"] . "**\n";
            $summary .= "- Output: byte-identical in two independent runs\n";
            $summary .= "- Provenance: see revisions.txt and both canonical map artifacts\n";
            $summary .= "- Not evidence of identity, correctness, approval, or permission to change code.\n";
            file_put_contents((string) getenv("GITHUB_STEP_SUMMARY"), $summary, FILE_APPEND);
            echo $summary;
          ' "$PROBE_OUT/history-diff.json" "$PROBE_OUT/retarget-evidence.json"
          rm "$PROBE_OUT/repeat.json"

      - name: Upload reproducible source-backed evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-retarget-probe
          path: |
            ${{ runner.temp }}/semantic-retarget-probe/revisions.txt
            ${{ runner.temp }}/semantic-retarget-probe/before.json
            ${{ runner.temp }}/semantic-retarget-probe/before.relations.json
            ${{ runner.temp }}/semantic-retarget-probe/after.json
            ${{ runner.temp }}/semantic-retarget-probe/after.relations.json
            ${{ runner.temp }}/semantic-retarget-probe/history-diff.json
            ${{ runner.temp }}/semantic-retarget-probe/retarget-evidence.json
          if-no-files-found: warn
          retention-days: 7

  frozen-historical-corpus:
    name: Frozen real history ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 019-to-020
            before: '555c3ad40cb8023444695219fbfb79a119767f46'
            after: '96bffea331cec063adba37e6659e5f3760202f9b'
          - label: 021-to-022
            before: '52c901f42f338bb6c1f29d5512873b05a751cdba'
            after: '91e631249f3e3bcfd8b5783f600f2a6d8818cab2'
          - label: 022-to-0225
            before: '91e631249f3e3bcfd8b5783f600f2a6d8818cab2'
            after: '5e5b179176ce8b9fa961c795daf84d1c692bc064'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Build fixed source-backed maps with one current analyzer
        shell: bash
        env:
          BEFORE_COMMIT: ${{ matrix.before }}
          AFTER_COMMIT: ${{ matrix.after }}
          CASE_LABEL: ${{ matrix.label }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]] || { echo 'Analyzer checkout is not exact head.' >&2; exit 1; }
          out="$RUNNER_TEMP/semantic-retarget-corpus/$CASE_LABEL"
          mkdir -p "$out"
          for ref in "$BEFORE_COMMIT" "$AFTER_COMMIT"; do
            git cat-file -e "$ref^{commit}" || { echo "Unknown frozen commit: $ref" >&2; exit 1; }
          done
          git worktree add --detach "$out/previous" "$BEFORE_COMMIT"
          git worktree add --detach "$out/current" "$AFTER_COMMIT"
          printf 'analyzer_sha=%s\nbefore_sha=%s\nafter_sha=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git -C "$out/previous" rev-parse HEAD)" \
            "$(git -C "$out/current" rev-parse HEAD)" > "$out/revisions.txt"
          php bin/agent-map build --root="$out/previous" --paths=src --out="$out/before.json" --phpstan-memory-limit=512M
          php bin/agent-map build --root="$out/current" --paths=src --out="$out/after.json" --phpstan-memory-limit=512M
          echo "CORPUS_OUTPUT=$out" >> "$GITHUB_ENV"
      - name: Measure fixed real evolution, completeness and determinism
        shell: bash
        env:
          CASE_LABEL: ${{ matrix.label }}
        run: |
          set -euo pipefail
          php tools/temporal-retarget-probe.php --self-test
          php bin/agent-map history diff \
            --before="$CORPUS_OUTPUT/before.json" \
            --after="$CORPUS_OUTPUT/after.json" \
            --format=json --limit=250000 > "$CORPUS_OUTPUT/history-diff.json"
          php tools/temporal-retarget-probe.php "$CORPUS_OUTPUT/history-diff.json" > "$CORPUS_OUTPUT/retarget-evidence.json"
          php tools/temporal-retarget-probe.php "$CORPUS_OUTPUT/history-diff.json" > "$CORPUS_OUTPUT/repeat.json"
          cmp "$CORPUS_OUTPUT/retarget-evidence.json" "$CORPUS_OUTPUT/repeat.json"
          rm "$CORPUS_OUTPUT/repeat.json"
          php -r '
            $diff = json_decode((string) file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            $probe = json_decode((string) file_get_contents($argv[2]), true, 512, JSON_THROW_ON_ERROR);
            if (($diff["truncated"] ?? true)
                || ($diff["event_count"] ?? 0) < 1
                || ($probe["evidence_level"] ?? null) !== "UNVERIFIED"
                || ($probe["schema_version"] ?? null) !== 2
                || ($probe["before_map_digest"] ?? null) !== ($diff["before_map_digest"] ?? null)
                || ($probe["after_map_digest"] ?? null) !== ($diff["after_map_digest"] ?? null)) {
              throw new RuntimeException("Invalid frozen history comparison evidence.");
            }
            $counts = $diff["counts"] ?? [];
            $summary = "## Frozen history: " . $argv[3] . "\n\n";
            $summary .= "- Original history events: **" . $diff["event_count"] . "**\n";
            $summary .= "- Relation added/removed: **" . ($counts["relation_added"] ?? 0) . " / " . ($counts["relation_removed"] ?? 0) . "**\n";
            $summary .= "- Retarget candidates (UNVERIFIED): **" . $probe["candidate_count"] . "**\n";
            $summary .= "- Ambiguous call groups: **" . $probe["ambiguous_group_count"] . "**\n";
            $summary .= "- Excluded non-call changes: **" . $probe["suppressed_non_call_group_count"] . "**\n";
            $summary .= "- Possible method renames (NOT retargets): **" . $probe["possible_rename_count"] . "**\n";
            $summary .= "- Repeated call-target migration groups: **" . $probe["repeated_migration_group_count"] . "**\n";
            $summary .= "- Repeated classification: byte-identical; no inference of identity or authority.\n";

            // Frozen falsification corpus: assertions are grounded in source
            // changes verified before adding this second classifier version.
            if ($argv[3] === "019-to-020" && (
                $probe["candidate_count"] !== 0
                || $probe["suppressed_non_call_group_count"] < 3
            )) {
              throw new RuntimeException("Known property-set additions were classified as calls.");
            }
            if ($argv[3] === "021-to-022" && (
                $probe["possible_rename_count"] < 1
                || $probe["candidate_count"] !== 0
            )) {
              throw new RuntimeException("Known method rename was not separated.");
            }
            if ($argv[3] === "022-to-0225") {
              $found = false;
              foreach ($probe["repeated_migrations"] as $migration) {
                if (str_ends_with($migration["from_target_ids"], "IndexReader::read")
                    && str_ends_with($migration["to_target_ids"], "IndexReader::readForRoot")
                    && $migration["occurrence_count"] >= 2) {
                  $found = true;
                }
              }
              if (!$found) {
                throw new RuntimeException("Known source-backed call-target migration was not grouped.");
              }
            }

            file_put_contents((string) getenv("GITHUB_STEP_SUMMARY"), $summary, FILE_APPEND);
            echo $summary;
            foreach (array_slice($probe["possible_renames"], 0, 5) as $rename) {
              echo "POSSIBLE_RENAME " . json_encode($rename, JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n";
            }
            foreach (array_slice($probe["repeated_migrations"], 0, 10) as $migration) {
              echo "MIGRATION " . json_encode($migration, JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n";
            }
            foreach (array_slice($probe["candidates"], 0, 10) as $candidate) {
              echo json_encode($candidate, JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR), "\n";
            }
          ' "$CORPUS_OUTPUT/history-diff.json" "$CORPUS_OUTPUT/retarget-evidence.json" "$CASE_LABEL"
      - name: Upload frozen historical comparison evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-retarget-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/semantic-retarget-corpus/${{ matrix.label }}/revisions.txt
            ${{ runner.temp }}/semantic-retarget-corpus/${{ matrix.label }}/before.json
            ${{ runner.temp }}/semantic-retarget-corpus/${{ matrix.label }}/before.relations.json
            ${{ runner.temp }}/semantic-retarget-corpus/${{ matrix.label }}/after.json
            ${{ runner.temp }}/semantic-retarget-corpus/${{ matrix.label }}/after.relations.json
            ${{ runner.temp }}/semantic-retarget-corpus/${{ matrix.label }}/history-diff.json
            ${{ runner.temp }}/semantic-retarget-corpus/${{ matrix.label }}/retarget-evidence.json
          if-no-files-found: warn
          retention-days: 7
