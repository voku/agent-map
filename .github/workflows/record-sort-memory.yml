name: Collector sorter memory and time scaling

on:
  push:
    branches:
      - experiment/record-sort-memory-envelope-*
    paths:
      - .github/workflows/record-sort-memory.yml
      - tools/record-sort-memory-worker.php
      - tools/record-sort-memory-benchmark.php
  pull_request:
    paths:
      - .github/workflows/record-sort-memory.yml
      - tools/record-sort-memory-worker.php
      - tools/record-sort-memory-benchmark.php
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-scale:
    name: Exact-order sorter memory scale (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Verify benchmark-worker and harness syntax
        run: |
          php -l tools/record-sort-memory-worker.php
          php -l tools/record-sort-memory-benchmark.php
      - name: Measure isolated historical-vs-current sort memory peaks and exact byte parity
        run: php tools/record-sort-memory-benchmark.php
      - name: Run existing record-order regression tests
        run: vendor/bin/phpunit tests/CollectedRecordSorterTest.php
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sort-memory-php-${{ matrix.php }}
          path: ${{ runner.temp }}/record-sort-memory-report.json
          if-no-files-found: warn
