name: Remove Impossible Symbol Check

on:
  push:
    branches:
      - agent/issue-12-symbol-less-search
    paths:
      - '.github/workflows/remove-impossible-symbol-check.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove dead post-condition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Search/ChunkExtractor.php')
          text = path.read_text(encoding='utf-8')
          old = '            if ($file->symbols !== [] && count($chunks) === $before) {\n'
          new = '            if (count($chunks) === $before) {\n'
          if text.count(old) != 1:
              raise SystemExit('expected one now-impossible symbol check')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git rm .github/workflows/remove-impossible-symbol-check.yml
          git diff --check

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: remove impossible symbol check'
          git push origin HEAD:agent/issue-12-symbol-less-search
