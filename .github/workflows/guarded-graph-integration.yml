name: Released graph end-to-end build benchmark

on:
  push:
    branches:
      - perf/guarded-graph-reuse-*
  pull_request:
    paths:
      - .github/workflows/guarded-graph-integration.yml
      - src/Index/MapGraphIndex.php
      - src/Index/IndexWriter.php
      - tests/GuardedGraphReuseTest.php
      - composer.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: Release graph build parity (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          path: agent-map
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install released owner graph through Composer
        working-directory: agent-map
        shell: bash
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist
          php -r '
            require "vendor/autoload.php";
            if (!method_exists(\voku\AgentGraph\Sqlite\GraphStore::class, "advanceProvenanceIfUnchanged")) {
              throw new RuntimeException("Published agent-graph dependency lacks guarded provenance API.");
            }
          '
      - name: Downstream full consumer tests and PHPStan
        working-directory: agent-map
        run: composer ci
      - name: Paired released-package PHPStan build proof
        working-directory: agent-map
        shell: bash
        run: |
          set -euo pipefail
          index="$RUNNER_TEMP/guarded-map.json"
          php bin/agent-map build --root="$PWD" --paths=src --out="$index"
          echo "| PHP | Sample | Guarded changed build (ms) | Forced replacement build (ms) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
          for sample in 1 2 3; do
            # A graph-replacement attempt is an explicit failure in the reuse half.
            php -r '
              $db = new PDO("sqlite:" . getenv("RUNNER_TEMP") . "/guarded-map.graph.sqlite", null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
              $db->exec("CREATE TRIGGER block_graph_replace BEFORE DELETE ON graph_relations BEGIN SELECT RAISE(ABORT, " . $db->quote("unexpected full graph replacement") . "); END");
            '
            printf '\n// CI reusable non-relation edit %s\n' "$sample" >> src/Index/GraphIndexFingerprint.php
            started="$(date +%s%N)"
            php bin/agent-map build --root="$PWD" --paths=src --out="$index"
            guarded_ms="$(( ($(date +%s%N) - started) / 1000000 ))"
            php -r '
              require "vendor/autoload.php";
              $index = getenv("RUNNER_TEMP") . "/guarded-map.json";
              $store = (new \voku\AgentMap\Index\MapGraphIndex())->verifyCurrent($index);
              if ($store->relationCount() < 100) { throw new RuntimeException("Graph relation count unexpectedly small."); }
            '
            # Enforce the existing full-replace path without changing product code.
            php -r '
              $db = new PDO("sqlite:" . getenv("RUNNER_TEMP") . "/guarded-map.graph.sqlite", null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
              $db->exec("DROP TRIGGER block_graph_replace");
              if ($db->exec("DELETE FROM graph_meta WHERE key = " . $db->quote("projection_digest_v1")) !== 1) {
                throw new RuntimeException("Missing graph projection digest control.");
              }
            '
            printf '\n// CI forced-rebuild non-relation edit %s\n' "$sample" >> src/Index/GraphIndexFingerprint.php
            started="$(date +%s%N)"
            php bin/agent-map build --root="$PWD" --paths=src --out="$index"
            replacement_ms="$(( ($(date +%s%N) - started) / 1000000 ))"
            php -r '
              require "vendor/autoload.php";
              $index = getenv("RUNNER_TEMP") . "/guarded-map.json";
              $store = (new \voku\AgentMap\Index\MapGraphIndex())->verifyCurrent($index);
              if ($store->relationCount() < 100) { throw new RuntimeException("Graph relation count unexpectedly small."); }
            '
            echo "| ${{ matrix.php }} | $sample | $guarded_ms | $replacement_ms |" >> "$GITHUB_STEP_SUMMARY"
            printf '%s,%s,%s,%s\n' "${{ matrix.php }}" "$sample" "$guarded_ms" "$replacement_ms" >> "$RUNNER_TEMP/graph-build-paired.csv"
          done
          echo "Measurements are same-runner alternating single-file-comment edits, not full statistical speedup claims."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-build-paired-php-${{ matrix.php }}
          path: ${{ runner.temp }}/graph-build-paired.csv
          if-no-files-found: warn
