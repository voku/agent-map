name: Guarded graph end-to-end integration

on:
  push:
    branches:
      - perf/guarded-graph-reuse-*
  pull_request:
    paths:
      - .github/workflows/guarded-graph-integration.yml
      - src/Index/MapGraphIndex.php
      - src/Index/IndexWriter.php
      - tests/GuardedGraphReuseTest.php
      - composer.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    name: Complete owner/consumer parity (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          path: agent-map
      - uses: actions/checkout@v7
        with:
          repository: voku/agent-graph
          ref: 60b86d9d080b081792058ec54a320a9871abe897
          path: agent-graph
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Resolve exact owner implementation through ephemeral path repository
        working-directory: agent-map
        shell: bash
        run: |
          set -euo pipefail
          composer config repositories.guarded-graph '{"type":"path","url":"../agent-graph","options":{"symlink":true,"versions":{"voku/agent-graph":"0.3.2"}}}'
          composer update --no-interaction --prefer-dist
          php -r '
            require "vendor/autoload.php";
            $file = (new ReflectionClass(\voku\AgentGraph\Sqlite\GraphStore::class))->getFileName();
            if (!is_string($file) || !str_contains(realpath($file) ?: "", "/agent-graph/src/")) {
              throw new RuntimeException("Not using the exact unmerged graph owner checkout.");
            }
            if (!method_exists(\voku\AgentGraph\Sqlite\GraphStore::class, "advanceProvenanceIfUnchanged")) {
              throw new RuntimeException("Guarded provenance API missing.");
            }
            echo "Owner: $file\n";
          '
      - name: Downstream full consumer tests and PHPStan
        working-directory: agent-map
        run: composer ci
      - name: PHPStan-backed changed-source refresh with graph row replacement blocked
        working-directory: agent-map
        shell: bash
        run: |
          set -euo pipefail
          index="$RUNNER_TEMP/guarded-map.json"
          php bin/agent-map build --root="$PWD" --paths=src --out="$index"
          php -r '
            $file = getenv("RUNNER_TEMP") . "/guarded-map.graph.sqlite";
            $db = new PDO("sqlite:" . $file, null, null, [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            $db->exec("CREATE TRIGGER block_graph_replace BEFORE DELETE ON graph_relations BEGIN SELECT RAISE(ABORT, \"unexpected full graph replacement\"); END");
          '
          printf '\n// Changed non-relation source evidence for guarded SQLite E2E.\n' >> src/Index/MapGraphIndex.php
          start="$(date +%s%N)"
          php bin/agent-map build --root="$PWD" --paths=src --out="$index"
          finish="$(date +%s%N)"
          echo "changed-source semantic build elapsed_ms: $(((finish-start)/1000000))" >> "$GITHUB_STEP_SUMMARY"
          php -r '
            require "vendor/autoload.php";
            $path = getenv("RUNNER_TEMP") . "/guarded-map.json";
            $graph = (new \voku\AgentMap\Index\MapGraphIndex())->verifyCurrent($path);
            if ($graph->relationCount() < 100) {
              throw new RuntimeException("Unexpectedly small graph after changed-source refresh.");
            }
            echo "Exact canonical fingerprint and SQLite integrity verified: " . $graph->relationCount() . " relations.\n";
          '
