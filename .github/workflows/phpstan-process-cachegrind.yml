name: PHPStan subprocess and cache attribution

on:
  push:
    branches:
      - experiment/phpstan-process-cachegrind-*
    paths:
      - .github/workflows/phpstan-process-cachegrind.yml
      - tools/phpstan-process-probe.php
  pull_request:
    paths:
      - .github/workflows/phpstan-process-cachegrind.yml
      - tools/phpstan-process-probe.php
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profiler:
    name: Real cold/warm/changed PHPStan + Xdebug attribution (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: xdebug
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Assert Xdebug profiler and PHPStan are installed
        shell: bash
        run: |
          set -euo pipefail
          php -m | grep -Fx xdebug
          php -r 'if (!extension_loaded("xdebug")) {throw new RuntimeException("Missing Xdebug");}'
          test -f vendor/phpstan/phpstan/phpstan.phar
      - name: Profile real map builds; strict canonical and graph parity
        env:
          XDEBUG_MODE: off
        run: |
          php -l tools/phpstan-process-probe.php
          php tools/phpstan-process-probe.php
      - name: Full tests and static analysis
        env:
          XDEBUG_MODE: off
        run: composer ci
      - name: Exercise changed-relation fallback and transactional safeguards
        env:
          XDEBUG_MODE: off
        run: vendor/bin/phpunit tests/GuardedGraphReuseTest.php
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phpstan-process-profile-php-${{ matrix.php }}
          path: ${{ runner.temp }}/phpstan-process-probe-*/report.json
          if-no-files-found: warn
