name: Tag release

on:
  push:
    branches: [main]
    paths:
      - '.release/*.json'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create requested release tags
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          markers=(.release/*.json)
          if [ "${#markers[@]}" -eq 0 ]; then
            echo 'No release markers found.' >&2
            exit 1
          fi

          frozen_main="$(git rev-parse HEAD)"
          for marker in "${markers[@]}"; do
            version="$(jq -er '.version' "$marker")"
            target="$(jq -er '.target_sha' "$marker")"
            if [[ "$version" != "$(basename "$marker" .json)" ]]; then
              echo "Marker filename/version mismatch: $marker -> $version" >&2
              exit 1
            fi
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release version: $version" >&2
              exit 1
            fi
            if [[ ! "$target" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo "Invalid release target SHA: $target" >&2
              exit 1
            fi
            git cat-file -e "${target}^{commit}"
            if ! git merge-base --is-ancestor "$target" "$frozen_main"; then
              echo "Release target $target is not reachable from frozen main $frozen_main" >&2
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              existing="$(git rev-list -n 1 "$version")"
              [[ "$existing" == "$target" ]] || { echo "Tag $version exists at $existing, expected $target" >&2; exit 1; }
              continue
            fi
            # The tag is created at the marker's target, so the target must be the release snapshot: it may differ
            # from the frozen main only in release markers. Otherwise commits that landed on main after the target
            # (between preparing the release and merging the marker) would be silently missing from the tag.
            outside_markers="$(git diff --name-only "$target" "$frozen_main" -- . ':(exclude).release/*.json')"
            if [[ -n "$outside_markers" ]]; then
              echo "Release target $target differs from frozen main $frozen_main outside .release/*.json:" >&2
              echo "$outside_markers" >&2
              echo "Point .release/$version.json at the current main commit that contains the $version changelog section." >&2
              exit 1
            fi
            if ! grep -Fq "## [$version] - " CHANGELOG.md && ! grep -Fq "## $version - " CHANGELOG.md; then
              echo "CHANGELOG.md has no release section for $version" >&2
              exit 1
            fi
            # Capture once and match in-shell: under pipefail, `git show | grep -q` fails with SIGPIPE (141)
            # once grep exits early on a CHANGELOG larger than the pipe buffer (voku/agent-loop finding.2026-09-19.95209d).
            target_changelog="$(git show "${target}:CHANGELOG.md")"
            if [[ "$target_changelog" != *"## [$version] - "* \
              && "$target_changelog" != *"## $version - "* ]]; then
              echo "Release target $target does not contain the $version changelog section" >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$version" "$target" -m "agent-map $version"
            git push origin "refs/tags/$version"
          done
