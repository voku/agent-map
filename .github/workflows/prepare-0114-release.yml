name: Prepare 0.11.4 release content

on:
  push:
    branches:
      - release/0.11.4
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/0.11.4' || github.ref_name == 'release/0.11.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.11.4
      - name: Insert release notes and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '## 0.11.3 - 2026-09-09\n'
          if '## 0.11.4 - 2026-09-09\n' not in text:
              section = '''## 0.11.4 - 2026-09-09

### Fixed

- Declare `nikic/php-parser:^5.0` as a direct runtime dependency because agent-map production code directly consumes php-parser 5 APIs. A lowest-dependency consumer can no longer resolve php-parser 4.x and then type-error in class move/rename planning despite satisfying the published Composer metadata.

### Validation

- Add a dedicated `--prefer-lowest` dependency-floor check that asserts php-parser 5.x and exercises the class-move and class-rename planner regressions. Exact-head PHP 8.2, 8.3, 8.4 and 8.5 `composer ci`, structural/temporal checks, and rename/removal/class-move dogfood are green.

'''
              if marker not in text:
                  raise SystemExit('0.11.3 changelog marker not found')
              text = text.replace(marker, section + marker, 1)
              path.write_text(text)
          PY
          rm .github/workflows/prepare-0114-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .github/workflows/prepare-0114-release.yml
          git commit -m 'chore(release): prepare 0.11.4'
          git push origin HEAD:release/0.11.4
