name: Normalize issue 76 patch

on:
  push:
    branches:
      - fix/76-search-refresh-duplicate-precedence
    paths:
      - .github/workflows/issue-76-apply-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/76-search-refresh-duplicate-precedence

      - name: Restore untouched source spelling
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/Search/SearchIndexStore.php')
          lines = path.read_text().splitlines()
          class_probe = 0
          tokenizer = 0

          for index, line in enumerate(lines):
              if "class_exists('Pdo" in line:
                  lines[index] = "        $this->pdo = class_exists('Pdo\\Sqlite')"
                  class_probe += 1
              if '$tokens = preg_split(' in line:
                  lines[index] = r"        $tokens = preg_split('/[^\p{L}\p{N}_:\\\\]+/u', $query) ?: [];"
                  tokenizer += 1

          if class_probe != 1 or tokenizer != 1:
              raise SystemExit(f'unexpected source shape: class_probe={class_probe}, tokenizer={tokenizer}')

          path.write_text('\n'.join(lines) + '\n')

      - name: Commit normalized source and remove carrier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-76-apply-patch.yml
          git add src/Search/SearchIndexStore.php
          git commit -m "chore: restore untouched search source spelling"
          git push origin HEAD:fix/76-search-refresh-duplicate-precedence
