name: Prepare 0.8.2 release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-0.8.2.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare exact release metadata
        shell: bash
        run: |
          set -euo pipefail
          target='7175004f1db6d3217655374275922e9fe4b15a34'
          git merge-base --is-ancestor "${target}" HEAD

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $path = 'CHANGELOG.md';
          $text = file_get_contents($path);
          if ($text === false) {
              throw new RuntimeException('Cannot read CHANGELOG.md');
          }

          $anchor = "## 0.8.1 - 2026-08-15\n";
          if (substr_count($text, $anchor) !== 1) {
              throw new RuntimeException('0.8.1 changelog anchor is not unique');
          }
          if (str_contains($text, '## 0.8.2 - 2026-08-18')) {
              throw new RuntimeException('0.8.2 section already exists');
          }

          $section = <<<'CHANGELOG'
          ## 0.8.2 - 2026-08-18

          ### Added

          - Add explicit semantic-backend selection so embedders can choose `auto`, `structural`, or `phpstan` without treating PHPStan availability as an implicit install-time requirement.
          - Preserve structural map generation as a supported capability when semantic PHPStan analysis is unavailable or intentionally not selected.

          ### Changed

          - Backend identity is now explicit owner data that lifecycle hosts can consume instead of re-detecting semantic capability themselves.

          ### Validation

          - PR #23 passed PHPUnit/PHPStan CI on PHP 8.2, 8.3, 8.4, and 8.5 on its exact head before merge.

          CHANGELOG;

          $updated = str_replace($anchor, $section . $anchor, $text, $count);
          if ($count !== 1) {
              throw new RuntimeException('Failed to insert 0.8.2 changelog section');
          }
          if (file_put_contents($path, $updated) === false) {
              throw new RuntimeException('Cannot write CHANGELOG.md');
          }
          PHP

          mkdir -p .release
          cat > .release/0.8.2.json <<'JSON'
          {
            "version": "0.8.2",
            "target_sha": "7175004f1db6d3217655374275922e9fe4b15a34"
          }
          JSON

          rm .github/workflows/prepare-0.8.2.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md .release/0.8.2.json .github/workflows/prepare-0.8.2.yml
          git diff --cached --check
          git commit -m 'release: prepare 0.8.2'
          git tag -a '0.8.2' "${target}" -m 'agent-map 0.8.2'
          git push --atomic origin HEAD:main refs/tags/0.8.2

# Retrigger the existing one-shot release after the initial push event did not execute it.
