name: Export working copy

on:
  push:
    branches:
      - feat/toon-map-store

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: tar --exclude-vcs -czf /tmp/agent-map-working-copy.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: agent-map-working-copy
          path: /tmp/agent-map-working-copy.tar.gz
          retention-days: 1
