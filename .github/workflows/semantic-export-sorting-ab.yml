name: PHPStan semantic exporter native-sort A/B

on:
  push:
    branches:
      - experiment/semantic-export-sorting-ab-*
    paths:
      - .github/workflows/semantic-export-sorting-ab.yml
      - src/PhpStan/CollectedRecordSorter.php
      - src/PhpStan/CollectedMapExportRule.php
      - tests/CollectedRecordSorterTest.php
      - tools/semantic-export-ab.php
  pull_request:
    paths:
      - .github/workflows/semantic-export-sorting-ab.yml
      - src/PhpStan/CollectedRecordSorter.php
      - src/PhpStan/CollectedMapExportRule.php
      - tests/CollectedRecordSorterTest.php
      - tools/semantic-export-ab.php
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Same-source real PHPStan exporter A/B (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          path: baseline
          ref: a84c9f613f65d5cfda7ec31b49a46eb0448c2978
      - uses: actions/checkout@v7
        with:
          path: candidate
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install identical locked dependencies in separate package checkouts
        shell: bash
        run: |
          set -euo pipefail
          composer install --working-dir=baseline --no-interaction --prefer-dist
          composer install --working-dir=candidate --no-interaction --prefer-dist
          cmp baseline/composer.lock candidate/composer.lock
      - name: Create one actual source-tree fixture shared across baseline and candidate
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/semantic-export-ab"
          mkdir -p "$fixture"
          cp -a candidate/src "$fixture/src"
          cp candidate/composer.json candidate/composer.lock "$fixture/"
          test -f "$fixture/src/Index/MapGraphIndex.php"
      - name: Validate exact comparator equivalence and benchmark syntax
        shell: bash
        working-directory: candidate
        run: |
          set -euo pipefail
          php -l src/PhpStan/CollectedRecordSorter.php
          php -l tools/semantic-export-ab.php
          vendor/bin/phpunit tests/CollectedRecordSorterTest.php
      - name: Compare real PHPStan full CLI cold/warm/changed builds and relation-change negative
        env:
          AGENT_MAP_AB_FIXTURE: ${{ runner.temp }}/semantic-export-ab
          AGENT_MAP_AB_BASELINE: ${{ github.workspace }}/baseline
          AGENT_MAP_AB_CANDIDATE: ${{ github.workspace }}/candidate
          AGENT_MAP_AB_MAIN_SHA: a84c9f613f65d5cfda7ec31b49a46eb0448c2978
        shell: bash
        run: |
          set -euo pipefail
          php candidate/tools/semantic-export-ab.php
      - name: Full candidate test, static analysis and negative graph fallback
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          composer ci
          vendor/bin/phpunit tests/GuardedGraphReuseTest.php
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semantic-export-ab-php-${{ matrix.php }}
          path: ${{ runner.temp }}/semantic-export-ab/semantic-export-ab-report.json
          if-no-files-found: warn
